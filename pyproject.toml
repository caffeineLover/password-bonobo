[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "password-bonobo"
version = "0.0.0"
description = "A local-file-first PasswordSafe-compatible password manager core."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
authors = [{ name = "Password Bonobo contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
  "autopep8>=2.3,<3",
  "bandit[toml]>=1.8,<2",
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "reuse>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bonobo_core"]

[tool.autopep8]
max_line_length = 120
ignore = ["E266", "E302", "E303"]
recursive = true

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM", "RUF"]
ignore = ["E303"]

[tool.ruff.lint.isort]
lines-after-imports = 3

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "tools"]
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=bonobo_core --cov=tools --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["bonobo_core", "tools"]

[tool.bandit]
targets = ["src", "tools"]
