name: foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, verified 2026-08-22
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0, verified 2026-08-22
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - id: botan
        shell: pwsh
        run: >-
          uv run python -m tools.build_botan --target host --output build/botan
          --github-output $env:GITHUB_OUTPUT
      - run: uv run autopep8 --in-place --recursive src tests tools
      - run: git diff --exit-code -- src tests tools
      - run: uv run ruff check src tests tools
      - run: uv run mypy src tests tools
      - name: Run tests
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "macOS") {
            $testTemp = & mktemp -d /tmp/password-bonobo-pytest.XXXXXX
            if (-not $testTemp -or $LASTEXITCODE -ne 0) { throw "could not create the macOS test temporary root" }
            & chmod -N $testTemp
            if ($LASTEXITCODE -ne 0) { throw "could not clear the macOS test temporary-root ACL" }
            & chmod 700 $testTemp
            if ($LASTEXITCODE -ne 0) { throw "could not secure the macOS test temporary root" }
            $env:TMPDIR = $testTemp
          }
          uv run python -m pytest
        env:
          BONOBO_TEST_BOTAN_LIBRARY: ${{ steps.botan.outputs.library }}
      - run: uv run python -m tools.check_python_structure src tests tools
      - run: uv run python -m tools.check_compatibility
      - run: uv run python -m tools.check_provenance
      - shell: bash
        run: git ls-files -z | uv run python -m tools.check_tracked_files
      - run: uv run bandit -c pyproject.toml -r src tools
      - run: uv run pip-audit
      - run: uv run reuse --no-multiprocessing lint
      - run: uv build
      - run: uv run python -m tools.check_wheel dist

  android-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, verified 2026-08-22
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0, verified 2026-08-22
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Cross-build and link Android arm64 Botan probe
        shell: pwsh
        run: |
          if (-not $env:ANDROID_NDK_LATEST_HOME) { throw "runner Android NDK is unavailable" }
          $env:ANDROID_NDK_ROOT = $env:ANDROID_NDK_LATEST_HOME
          uv run python -m tools.build_botan --target android-arm64 --output build/botan-android --smoke-link

  ios-cross:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, verified 2026-08-22
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0, verified 2026-08-22
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Cross-build and link iOS arm64 Botan probe
        run: uv run python -m tools.build_botan --target ios-arm64 --output build/botan-ios --smoke-link
